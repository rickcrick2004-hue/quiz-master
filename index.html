g:12px 14px;color:#2a527d;font-size:13px}.warning{background:#fff4e4;border:1px solid #ffda9b;color:#8f5707;border-radius:12px;padding:13px}.segmented{display:flex;gap:6px;background:#edf2f9;padding:5px;border-radius:13px}.segmented button{flex:1;border:0;border-radius:10px;padding:12px;background:transparent;font-weight:750;color:#60718a}.segmented button.active{background:#fff;color:var(--blue);box-shadow:0 2px 8px #24435b15}.label{display:block;font-size:13px;font-weight:800;margin-bottom:7px}.field,select,textarea{background:#fff;border:1px solid #becbdd;border-radius:10px;padding:10px 12px;width:100%;min-height:43px;color:var(--text)}textarea{resize:vertical;min-height:90px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.formfield{margin-bottom:15px}.chips{display:flex;flex-wrap:wrap;gap:8px}.checkchip{display:inline-flex;gap:5px;align-items:center;border-radius:30px;border:1px solid #d7e1ee;padding:7px 12px;background:#fff;font-size:12px;cursor:pointer;user-select:none}.checkchip:has(input:checked){background:#e9f2ff;border-color:#8fbdfa;color:#174e91}.checkchip input{accent-color:#2775dd}.listrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:1px solid #e8edf3;padding:12px 0}.listrow:last-child{border-bottom:0}.listrow .rowmain{flex:1;min-width:0}.qline{font-weight:700;font-size:14px;line-height:1.58;overflow-wrap:anywhere}.answerline{font-size:13px;color:var(--green);margin-top:4px}.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:7px}.list-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.scroll-list{border:1px solid var(--line);border-radius:12px;max-height:400px;overflow-y:auto;padding:0 13px}.manual-item{display:flex;align-items:flex-start;gap:9px;border-bottom:1px solid #e8edf3;padding:11px 0;font-size:13px}.manual-item input{margin-top:4px;width:19px;height:19px;accent-color:#2975dd;flex-shrink:0}.manual-item:last-child{border-bottom:0}.selection-row{display:flex;align-items:center;gap:9px;justify-content:space-between;border-bottom:1px solid #e8edf3;padding:9px 0}.selection-row:last-child{border-bottom:0}.selection-row .minq{font-size:13px;flex:1;min-width:0}.badge-number{color:#5e6c81;font-size:12px;font-weight:800}.countbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin:14px 0 10px}.flexgrow{flex:1;min-width:0}.playwrap{max-width:690px;margin:auto}.playpanel{background:linear-gradient(145deg,#192a45,#17253d);border-radius:20px;padding:19px;color:#fff;box-shadow:0 16px 35px #1b32502b}.playtop{display:flex;align-items:center;justify-content:space-between;gap:10px}.playtop .pill{background:#30496d;color:#e7f1ff}.progress{height:7px;background:#405471;border-radius:12px;overflow:hidden;margin:15px 0}.progress>div{height:100%;background:#75b0ff;transition:width .2s}.questionpanel{background:#283d5d;border:1px solid #476182;border-radius:16px;padding:23px 21px;min-height:220px;display:flex;flex-direction:column;justify-content:center}.question-text{font-size:clamp(23px,4.6vw,32px);line-height:1.6;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere}.answerpanel{margin:13px 0;min-height:88px;padding:15px 18px;background:#233651;border-radius:13px;display:flex;flex-direction:column;justify-content:center}.answerpanel.revealed{background:#1d543b}.answerpanel strong{font-size:26px;line-height:1.5;color:#fff;overflow-wrap:anywhere}.playpanel .btn{font-size:16px}.playpanel .btn.big{font-size:17px;min-height:53px}.playpanel .btn.secondary{background:#334a69;border-color:#5d7391;color:#fff}.playpanel .btn.outline{background:transparent;border-color:#6c82a0;color:#fff}.playpanel .btn.danger{background:#4d313c;color:#ffe9ed;border-color:#805463}.playpanel .small{color:#c5d3e8}.play-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.playtools{display:flex;justify-content:space-between;gap:7px;flex-wrap:wrap;margin-top:12px}.playtools button{background:transparent;border:0;color:#d5e2f4;font-size:13px;padding:10px}.empty{text-align:center;color:var(--muted);padding:36px 18px}.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}.history-details{background:#f4f7fc;border-radius:11px;padding:10px;margin:10px 0}.tocount{display:flex;justify-content:space-between;align-items:center;gap:10px}.hide{display:none!important}dialog{width:min(610px,calc(100vw - 24px));border:1px solid #d5e0ed;border-radius:18px;padding:0;box-shadow:0 28px 70px #0a203e55;max-height:calc(100dvh - 26px);overflow-y:auto}dialog::backdrop{background:#0b1a31a8}.dialog-inner{padding:22px}.dialog-header{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.dialog-header h2{margin:0;font-size:20px}.xbtn{border:0;background:#edf1f7;color:#39506c;border-radius:9px;min-width:36px;min-height:36px;font-size:20px}.toast{position:fixed;z-index:80;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#203452;color:#fff;border-radius:13px;padding:11px 17px;font-size:13px;box-shadow:0 8px 30px #0c244641;opacity:0;pointer-events:none;transition:opacity .2s;max-width:min(600px,90vw);text-align:center}.toast.visible{opacity:1}.divider{border:0;border-top:1px solid var(--line);margin:15px 0}.stack{display:flex;flex-direction:column;gap:10px}.preview-box{max-height:210px;overflow:auto;padding:5px 10px;background:#f5f8fb;border-radius:10px;font-size:12px;white-space:pre-wrap}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.setselect{width:100%}.resultline{padding:13px 0;border-bottom:1px solid #e5ebf2}.resultline:last-child{border-bottom:0}
@media(max-width:700px){.shell{padding:17px 12px 105px}.card{padding:15px}.grid2,.split{grid-template-columns:1fr}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:21px}.stat span{font-size:11px}.pagehead h1{font-size:22px}.formgrid{grid-template-columns:1fr}.hero{padding:23px 19px}.hero h1{font-size:23px}.questionpanel{min-height:205px;padding:18px 17px}.question-text{font-size:24px}.answerpanel strong{font-size:24px}.list-actions{max-width:125px}.playpanel{padding:14px}.logo{font-size:18px}.main-nav button{min-width:60px;padding:6px 5px}.grid3{grid-template-columns:repeat(2,1fr)}}

<body>
<header class="app-header"><div class="header-inner"><div><div class="logo">⚡ QUIZ MASTER</div><div class="subtitle">先生のための早押しクイズ出題ツール</div></div><span class="localtag">Ver.1.0・端末内保存</span></div></header>
<nav class="main-nav" aria-label="メインメニュー">
<button data-route="home" class="active"><span class="glyph">⌂</span>ホーム</button>
<button data-route="setup"><span class="glyph">▦</span>出題設定</button>
<button data-route="play"><span class="glyph">▶</span>出題</button>
<button data-route="manage"><span class="glyph">☷</span>問題管理</button>
<button data-route="history"><span class="glyph">↶</span>履歴</button>
</nav>
<main id="screen" class="shell" aria-live="off"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<dialog id="editDialog"><div class="dialog-inner"><div class="dialog-header"><h2 id="editTitle">問題を編集</h2><button class="xbtn" type="button" data-action="close-edit" aria-label="閉じる">×</button></div><form id="editForm"><input type="hidden" id="edit-id"><div class="formfield"><label class="label" for="edit-question">問題文（必須）</label><textarea id="edit-question" required maxlength="1000" placeholder="生徒に読み上げる問題文"></textarea></div><div class="formfield"><label class="label" for="edit-answer">正解（必須）</label><input class="field" id="edit-answer" required maxlength="300"></div><div class="formfield"><label class="label" for="edit-aliases">別解・許容する答え（「、」などで区切る）</label><input class="field" id="edit-aliases" maxlength="500" placeholder="略称、通称など"></div><div class="formgrid"><div class="formfield"><label class="label" for="edit-category">ジャンル</label><input class="field" id="edit-category" list="categorySuggestions" required maxlength="80"><datalist id="categorySuggestions"></datalist></div><div class="formfield"><label class="label" for="edit-difficulty">難易度</label><select id="edit-difficulty"><option>簡単</option><option selected>普通</option><option>難しい</option></select></div></div><div class="formfield"><label class="label" for="edit-note">補足・解説（任意）</label><textarea id="edit-note" maxlength="1500" placeholder="正解後に伝えたい内容"></textarea></div><label class="checkchip"><input type="checkbox" id="edit-active" checked>出題に使用する</label><div class="btnrow" style="justify-content:flex-end;margin-top:19px"><button type="button" class="btn outline" data-action="close-edit">キャンセル</button><button type="submit" class="btn">保存する</button></div></form></div></dialog>
<dialog id="importDialog"><div class="dialog-inner"><div class="dialog-header"><h2>CSVの取り込み確認</h2><button class="xbtn" type="button" data-action="close-import" aria-label="閉じる">×</button></div><div id="importPreview"></div><div class="formfield"><label class="label" for="csvDupMode">同じ問題文がある場合</label><select id="csvDupMode"><option value="skip">スキップして追加しない（推奨）</option><option value="replace">既存の問題を更新する</option></select></div><div class="btnrow" style="justify-content:flex-end"><button class="btn outline" type="button" data-action="close-import">キャンセル</button><button class="btn" type="button" data-action="confirm-import">取り込む</button></div></div></dialog>
<input id="csvFile" type="file" accept=".csv,text/csv" hidden><input id="backupFile" type="file" accept=".json,application/json" hidden>

estion":"世界文化遺産に登録されている三池炭鉱の「万田坑」がある熊本県の市はどこでしょう？","answer":"荒尾市","aliases":"","category":"地元・福岡・九州","difficulty":"普通","note":"","active":true,"favorite":false,"updatedAt":""},{"id":"q149","number":149,"question":"「スウッシュ」と呼ばれる、チェックマークのようなロゴで知られるスポーツ用品メーカーは何でしょう？","answer":"NIKE（ナイキ）","aliases":"","category":"企業・商品・ブランド","difficulty":"普通","note":"","active":true,"favorite":false,"updatedAt":""},{"id":"q150","number":150,"question":"人気のチョコレート菓子「キットカット」を日本で販売している食品メーカーは何でしょう？","answer":"ネスレ日本","aliases":"","category":"企業・商品・ブランド","difficulty":"普通","note":"","active":true,"favorite":false,"updatedAt":""}];
const INITIAL_CATS=["学校で習う知識", "一般常識・雑学", "音楽・芸能・流行", "アニメ・漫画", "ゲーム", "スポーツ", "なぞなぞ・ひらめき", "YouTube・動画配信", "食べ物・スイーツ", "人気キャラクター", "映画・ドラマ", "スマホ・インターネット", "生き物・自然", "地元・福岡・九州", "企業・商品・ブランド"];
const STORAGE_KEY='quiz_master_local_v1';
const e=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const copy=o=>JSON.parse(JSON.stringify(o));
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;
const stamp=()=>new Date().toISOString();
const fmtDate=s=>s?new Date(s).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const norm=s=>String(s??'').normalize('NFKC').replace(/[\s　。、！？!?・「」『』（）()]/g,'').toLowerCase();
let storageOk=true,toastTimer=null,importBuffer=[];
function emptyDB(){return {version:1,questions:copy(INITIAL_QUESTIONS),sets:[],history:[],activeSession:null};}
function initDB(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw){const d=emptyDB();localStorage.setItem(STORAGE_KEY,JSON.stringify(d));return d;}const d=JSON.parse(raw);if(!d||!Array.isArray(d.questions)||!Array.isArray(d.sets)||!Array.isArray(d.history))throw Error('保存データが不正です');return d;}catch(err){storageOk=false;return emptyDB();}}
let db=initDB();
let state={route:'home',mode:'random',cats:new Set(getCats()),diffs:new Set(['簡単','普通','難しい']),count:'20',customCount:20,unseen:false,manualIds:[],manualQuery:'',manualCategory:'',manageQuery:'',manageCategory:'',manageDifficulty:'',manageActive:'all',managePage:0,historyOpen:null};
function getCats(){return [...new Set([...INITIAL_CATS,...db?.questions?.map(x=>x.category)||[]])].filter(Boolean);}
// getCats is evaluated after db initialization except inside state initializer; use initial cats here.
state.cats=new Set(INITIAL_CATS);
function persist(){if(!storageOk)return false;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true;}catch(err){storageOk=false;toast('保存できません。空き容量やプライベートモードをご確認ください。');return false;}}
function toast(msg){const node=document.querySelector('#toast');node.textContent=msg;node.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('visible'),3500);}
function qById(id){return db.questions.find(q=>q.id===id);}
function activeQ(){return db.questions.filter(q=>q.active!==false);}
function nextNumber(){return Math.max(0,...db.questions.map(q=>Number(q.number)||0))+1;}
function countText(){return db.questions.length.toLocaleString('ja-JP');}
function navigate(route){if(route==='play'&&!db.activeSession){state.route='setup';toast('出題設定から大会を開始してください。');}else state.route=route;render();window.scrollTo({top:0,behavior:'instant'});}
function navUpdate(){document.querySelectorAll('[data-route]').forEach(b=>{b.classList.toggle('active',b.dataset.route===state.route);b.setAttribute('aria-current',b.dataset.route===state.route?'page':'false');});}
function render(){navUpdate();const screen=document.querySelector('#screen');screen.innerHTML=state.route==='home'?renderHome():state.route==='setup'?renderSetup():state.route==='play'?renderPlay():state.route==='manage'?renderManage():renderHistory();bindViewInputs();}
function renderHome(){let s=db.activeSession;return `<div class="hero"><div class="tiny" style="color:#b9d2f5;font-weight:800">先生専用・クイズ出題アプリ</div><h1>問題を選んで、<br>スマホで読み上げる。</h1><p>早押し・得点は「QUIZ BATTLE!」にお任せ。<br>こちらは問題の出題に集中するためのアプリです。</p><div class="btnrow"><button class="btn" data-action="go-random">ランダム出題を始める →</button><button class="btn outline" data-action="go-manual" style="background:#274669;color:#fff;border-color:#6d88a8">問題を選んで出題</button></div></div>
${!storageOk?'<div class="warning" style="margin-bottom:14px">ブラウザの保存機能が利用できません。変更内容はページを閉じると消えるため、通常のブラウザで開いてください。</div>':''}
${s?`<div class="card" style="border-color:#9dc2ff;margin-bottom:17px;background:#f4f9ff"><div class="topline"><div><span class="pill green">進行中の大会</span><h3 style="margin:7px 0 2px">${e(s.name)}</h3><div class="small">${e(s.mode==='random'?'ランダム出題':'選択出題')} · ${s.index+1}/${s.items.length}問目 · ${e(fmtDate(s.startedAt))}</div></div><button class="btn" data-action="resume">続きから再開 →</button></div></div>`:''}
<div class="stats"><div class="stat"><strong>${countText()}</strong><span>登録問題数</span></div><div class="stat"><strong>${getCats().length}</strong><span>ジャンル</span></div><div class="stat"><strong>${db.sets.length}</strong><span>保存問題セット</span></div></div>
<div class="grid2"><div class="card"><h2 class="section-title">📘 問題を管理する</h2><p class="small">問題の検索・追加・修正、CSV一括登録。編集後はこの端末内に保存されます。</p><button class="btn secondary full" data-route="manage">問題管理を開く</button></div><div class="card"><h2 class="section-title">🕘 出題履歴を見る</h2><p class="small">過去の大会の出題内容を確認。出題済みを避けてランダム抽選することもできます。</p><button class="btn secondary full" data-route="history">出題履歴を開く</button></div></div>
<div class="note" style="margin-top:18px"><b>Ver.1.0について：</b>現在はFirebase未接続です。問題の追加・編集や履歴は、このブラウザの端末内に保存され、PCとスマホにはまだ同期されません。問題管理からJSONバックアップを保存してください。スマホで使う際はWeb公開後のブラウザ利用を想定しています。</div>`;}
function renderSetup(){return `<div class="pagehead"><div><h1>出題設定</h1><div class="small">ランダム出題と、問題を指定する出題の両方に対応</div></div></div><div class="card"><div class="segmented"><button data-action="mode-random" class="${state.mode==='random'?'active':''}">🎲 ランダム出題</button><button data-action="mode-manual" class="${state.mode==='manual'?'active':''}">☑ 選択して出題</button></div></div><div id="setupBody">${state.mode==='random'?renderRandomSetup():renderManualSetup()}</div>`;}
function renderRandomSetup(){const catChecks=getCats().map(c=>`<label class="checkchip"><input type="checkbox" data-cat="${e(c)}" ${state.cats.has(c)?'checked':''}>${e(c)} <span class="tiny">(${activeQ().filter(q=>q.category===c).length})</span></label>`).join('');const diffChoices=['簡単','普通','難しい'].map(d=>`<label class="checkchip"><input type="checkbox" data-diff="${e(d)}" ${state.diffs.has(d)?'checked':''}>${e(d)}</label>`).join('');const cnt=['10','20','30','50','all','custom'].map(c=>`<option value="${c}" ${c===state.count?'selected':''}>${c==='all'?'対象の全問':c==='custom'?'自由指定':c+'問'}</option>`).join('');const eligible=getRandomCandidates();return `<div class="card"><div class="topline"><h2 class="section-title">① ジャンルを選ぶ</h2><div class="btnrow"><button class="btn smallbtn secondary" data-action="all-cats">すべて選択</button><button class="btn smallbtn outline" data-action="no-cats">すべて解除</button></div></div><div class="chips">${catChecks}</div><hr class="divider"><h2 class="section-title">② 難易度を選ぶ</h2><div class="chips">${diffChoices}</div><hr class="divider"><h2 class="section-title">③ 出題数と条件</h2><div class="formgrid"><div><label class="label" for="randomCount">出題数</label><select id="randomCount">${cnt}</select></div><div><label class="label" for="customCount">自由指定の問題数</label><input class="field" id="customCount" type="number" min="1" max="9999" value="${state.customCount}" ${state.count==='custom'?'':'disabled'}></div></div><label class="checkchip" style="margin-top:14px"><input id="unseenOnly" type="checkbox" ${state.unseen?'checked':''}>過去の大会で出題した問題を除く</label><div class="note" style="margin-top:14px">条件に合う問題：<b>${eligible.length}問</b>　／　今回の出題予定：<b>${state.count==='all'?eligible.length:state.count==='custom'?Number(state.customCount):Number(state.count)}問</b></div><div style="margin-top:17px"><button class="btn full" data-action="start-random" ${eligible.length===0?'disabled':''}>🎲 この条件で大会を開始</button></div></div>`;}
function getUsedQuestionIds(){const all=[...db.history,...(db.activeSession?[db.activeSession]:[])];return new Set(all.flatMap(s=>s.items.filter((q,i)=>s.visited?.includes(i)&&!(s.skipped||[]).includes(i)).map(q=>q.id)));}
function getRandomCandidates(){const used=state.unseen?getUsedQuestionIds():new Set();return activeQ().filter(q=>state.cats.has(q.category)&&state.diffs.has(q.difficulty)&&!used.has(q.id));}
function manualAvailable(){const t=norm(state.manualQuery);return activeQ().filter(q=>(!state.manualCategory||q.category===state.manualCategory)&&(!t||norm(`${q.number} ${q.question} ${q.answer} ${q.aliases}`).includes(t)));}
function renderManualSetup(){const available=manualAvailable();return `<div class="split"><div class="card"><div class="topline"><h2 class="section-title">① 出題する問題を選ぶ</h2><span id="manualSelectedCount" class="pill">選択中 ${state.manualIds.length}問</span></div><div class="formgrid"><div><label class="label" for="manualSearch">キーワード検索</label><input class="field" id="manualSearch" placeholder="問題文・答え・番号" value="${e(state.manualQuery)}"></div><div><label class="label" for="manualCategory">ジャンル</label><select id="manualCategory"><option value="">すべてのジャンル</option>${getCats().map(c=>`<option ${state.manualCategory===c?'selected':''}>${e(c)}</option>`).join('')}</select></div></div><div class="countbar"><span class="small" id="manualCount">候補 ${available.length}問</span><div class="btnrow"><button class="btn smallbtn secondary" data-action="manual-add-visible">表示中を全選択</button><button class="btn smallbtn outline" data-action="manual-clear">選択解除</button></div></div><div class="scroll-list" id="manualList">${renderManualList(available)}</div></div><div class="card"><h2 class="section-title">② 順番を決める</h2><div class="formfield"><label class="label" for="savedSet">保存済みセットを読み込む</label><select class="setselect" id="savedSet"><option value="">選択してください</option>${db.sets.map(s=>`<option value="${e(s.id)}">${e(s.name)} (${s.questionIds.length}問)</option>`).join('')}</select><div class="btnrow" style="margin-top:6px"><button class="btn danger smallbtn" data-action="delete-set">読み込んだセットを削除</button></div></div><div class="btnrow" style="margin-bottom:12px"><button class="btn smallbtn secondary" data-action="shuffle-manual">順番をシャッフル</button><button class="btn smallbtn outline" data-action="save-set">セットを保存</button></div><div id="selectionList">${renderSelectionList()}</div><hr class="divider"><button class="btn full" data-action="start-manual" ${state.manualIds.length===0?'disabled':''}>▶ 選択した${state.manualIds.length}問で大会を開始</button><div class="small" style="margin-top:9px">問題は選んだ順番に出題されます。矢印で並べ替えできます。</div></div></div>`;}
function renderManualList(list){return list.length?list.map(q=>`<label class="manual-item"><input type="checkbox" data-manual="${e(q.id)}" ${state.manualIds.includes(q.id)?'checked':''}><span><strong class="badge-number">No.${e(q.number)}</strong> ${e(q.question)}<br><span class="tiny">${e(q.category)} ／ ${e(q.difficulty)} ／ <span style="color:#17764e">${e(q.answer)}</span></span></span></label>`).join(''):'<div class="empty">条件に合う問題がありません</div>';}
function renderSelectionList(){if(!state.manualIds.length)return '<div class="empty">まだ問題を選択していません</div>';return `<div class="scroll-list" style="max-height:420px">${state.manualIds.map((id,i)=>{const q=qById(id);return `<div class="selection-row"><span class="badge-number">${i+1}.</span><span class="minq">${q?e(q.question):'<span class="muted">削除された問題</span>'}</span><div class="btnrow" style="gap:2px"><button class="btn smallbtn outline" data-action="move-up" data-id="${e(id)}" ${i===0?'disabled':''} aria-label="上へ">↑</button><button class="btn smallbtn outline" data-action="move-down" data-id="${e(id)}" ${i===state.manualIds.length-1?'disabled':''} aria-label="下へ">↓</button><button class="btn smallbtn danger" data-action="remove-manual" data-id="${e(id)}" aria-label="除外">×</button></div></div>`}).join('')}</div>`;}
function snapshot(q){return copy({id:q.id,number:q.number,question:q.question,answer:q.answer,aliases:q.aliases,category:q.category,difficulty:q.difficulty,note:q.note});}
function newSession(items,mode,name){if(db.activeSession&&!confirm('進行中の大会があります。新しい大会を始めると、現在の大会は未完了として履歴に保存されます。続けますか？'))return; if(db.activeSession)archiveSession('中断');db.activeSession={id:uid(),name,mode,items:items.map(snapshot),index:0,visited:[0],skipped:[],reveal:false,startedAt:stamp(),updatedAt:stamp(),status:'進行中'};persist();navigate('play');}
function archiveSession(status='完了'){let s=db.activeSession;if(!s)return;s.status=status;s.endedAt=stamp();s.reveal=false;db.history.unshift(s);db.history=db.history.slice(0,200);db.activeSession=null;persist();}
function renderPlay(){let s=db.activeSession;if(!s)return `<div class="card empty"><h2>進行中の大会がありません</h2><p>出題設定から開始してください。</p><button class="btn" data-route="setup">出題設定へ</button></div>`;const q=s.items[s.index],source=qById(q.id),status=s.skipped.includes(s.index)?'スキップ':s.visited.includes(s.index)?'出題済':'未出題';const note=s.reveal&&q.note?`<div class="small" style="margin-top:9px">補足：${e(q.note)}</div>`:'';return `<div class="playwrap"><div class="pagehead"><div><h1>出題中</h1><div class="small">${e(s.name)} · ${e(s.mode==='random'?'ランダム出題':'選択出題')}</div></div><button class="btn smallbtn outline" data-action="pause">一時停止</button></div><div class="playpanel"><div class="playtop"><b>第 ${s.index+1} / ${s.items.length} 問</b><span class="pill">${e(q.category)}</span></div><div class="progress"><div style="width:${Math.round((s.index+1)/s.items.length*100)}%"></div></div><div class="playtop" style="margin-bottom:10px"><span class="small">No.${e(q.number)} · ${e(q.difficulty)}</span><span class="pill ${status==='スキップ'?'orange':''}">${status}</span></div><div class="questionpanel"><div class="small" style="margin-bottom:12px">問題</div><div class="question-text">${e(q.question)}</div></div><div class="answerpanel ${s.reveal?'revealed':''}">${s.reveal?`<span class="small" style="color:#b3f1d0">正解</span><strong>${e(q.answer)}</strong>${q.aliases?`<div class="small" style="color:#d7f1e4">別解：${e(q.aliases)}</div>`:''}${note}`:'<div class="small" style="text-align:center">正解は非表示です</div>'}</div><button class="btn big full" data-action="reveal">${s.reveal?'正解を隠す':'👁 正解を見る'}</button><div class="play-actions" style="margin-top:10px"><button class="btn outline" data-action="prev" ${s.index===0?'disabled':''}>← 前の問題</button><button class="btn secondary" data-action="next">${s.index===s.items.length-1?'大会を終了':'次の問題 →'}</button></div><div class="playtools"><button data-action="fav-play">${source?.favorite?'★ お気に入り済':'☆ お気に入り'}</button><button data-action="skip">⏭ ${s.skipped.includes(s.index)?'スキップ解除':'スキップ'}</button><button data-action="end-session">■ 大会を終了</button></div></div><div class="note" style="margin-top:14px">端末内で大会を自動保存しています。途中で閉じた場合はホームの「続きから再開」で戻れます。</div></div>`;}
function getFilteredManage(){const t=norm(state.manageQuery);return db.questions.filter(q=>(!state.manageCategory||q.category===state.manageCategory)&&(!state.manageDifficulty||q.difficulty===state.manageDifficulty)&&(state.manageActive==='all'||String(q.active!==false)===state.manageActive)&&(!t||norm(`${q.number} ${q.question} ${q.answer} ${q.aliases}`).includes(t)));}
function renderManage(){const count=db.questions.length;return `<div class="pagehead"><div><h1>問題管理</h1><div class="small">全${count}問 · 有効${activeQ().length}問 · お気に入り${db.questions.filter(q=>q.favorite).length}問</div></div><button class="btn" data-action="new-question">＋ 問題追加</button></div><div class="card"><div class="btnrow"><button class="btn secondary smallbtn" data-action="export-csv">CSV書き出し</button><button class="btn secondary smallbtn" data-action="import-csv">CSV一括追加</button><button class="btn outline smallbtn" data-action="export-json">JSONバックアップ</button><button class="btn outline smallbtn" data-action="import-json">JSON復元</button></div><div class="small" style="margin-top:10px">CSV：問題一覧の編集・追加用。JSON：出題履歴や保存セットを含む全データのバックアップ用です。</div><hr class="divider"><div class="formgrid"><div><label class="label" for="manageSearch">キーワード検索</label><input id="manageSearch" class="field" value="${e(state.manageQuery)}" placeholder="問題文・答え・番号で検索"></div><div><label class="label" for="manageCategory">ジャンル</label><select id="manageCategory"><option value="">すべて</option>${getCats().map(c=>`<option ${state.manageCategory===c?'selected':''}>${e(c)}</option>`).join('')}</select></div><div><label class="label" for="manageDifficulty">難易度</label><select id="manageDifficulty"><option value="">すべて</option>${['簡単','普通','難しい'].map(c=>`<option ${state.manageDifficulty===c?'selected':''}>${e(c)}</option>`).join('')}</select></div><div><label class="label" for="manageActive">使用状態</label><select id="manageActive"><option value="all">すべて</option><option value="true" ${state.manageActive==='true'?'selected':''}>使用中</option><option value="false" ${state.manageActive==='false'?'selected':''}>使用停止</option></select></div></div></div><div class="card" style="margin-top:16px"><div class="topline"><h2 class="section-title" style="margin:0">登録済みの問題</h2><span id="manageResults" class="small"></span></div><div id="manageList"></div><div id="managePagination" class="btnrow center" style="margin-top:18px"></div></div>`;}
function renderManageList(){const list=getFilteredManage(),size=20,allPages=Math.max(1,Math.ceil(list.length/size));state.managePage=Math.max(0,Math.min(state.managePage,allPages-1));const part=list.slice(state.managePage*size,(state.managePage+1)*size);document.querySelector('#manageResults').textContent=`${list.length}問 / 全${db.questions.length}問`;document.querySelector('#manageList').innerHTML=part.length?part.map(q=>`<div class="listrow"><div class="rowmain"><div class="qline"><span class="badge-number">No.${e(q.number)}</span> ${e(q.question)}</div><div class="answerline">正解：${e(q.answer)}</div><div class="meta"><span class="pill">${e(q.category)}</span><span class="pill gray">${e(q.difficulty)}</span>${q.active===false?'<span class="pill danger">使用停止</span>':''}${q.favorite?'<span class="pill orange">★ お気に入り</span>':''}</div></div><div class="list-actions"><button class="btn smallbtn outline" data-action="edit-question" data-id="${e(q.id)}">編集</button><button class="btn smallbtn ${q.active===false?'secondary':'outline'}" data-action="toggle-active" data-id="${e(q.id)}">${q.active===false?'使用再開':'使用停止'}</button><button class="btn smallbtn outline" data-action="toggle-favorite" data-id="${e(q.id)}">${q.favorite?'★':'☆'}</button></div></div>`).join(''):'<div class="empty">条件に合う問題がありません</div>';document.querySelector('#managePagination').innerHTML=`<button class="btn smallbtn outline" data-action="page-prev" ${state.managePage===0?'disabled':''}>← 前へ</button><span class="small">${state.managePage+1} / ${allPages}ページ</span><button class="btn smallbtn outline" data-action="page-next" ${state.managePage===allPages-1?'disabled':''}>次へ →</button>`;}
function renderHistory(){const h=db.history;return `<div class="pagehead"><div><h1>出題履歴</h1><div class="small">大会の記録は最大200件まで保存します</div></div><button class="btn smallbtn outline" data-route="setup">新しい大会</button></div>${db.activeSession?`<div class="card" style="border-color:#9dc5ff"><div class="topline"><div><span class="pill green">進行中</span><h3>${e(db.activeSession.name)}</h3><div class="small">${db.activeSession.items.length}問 · ${e(fmtDate(db.activeSession.startedAt))}</div></div><button class="btn" data-action="resume">再開する</button></div></div>`:''}<div class="card"><h2 class="section-title">これまでの大会</h2>${!h.length?'<div class="empty">まだ履歴がありません。大会を終了するとここに記録されます。</div>':h.map((s,i)=>`<div class="resultline"><div class="topline"><div><strong>${e(s.name)}</strong><div class="small">${e(fmtDate(s.startedAt))} · ${e(s.mode==='random'?'ランダム':'選択出題')} · ${s.items.length}問 · ${e(s.status)}</div></div><button class="btn smallbtn outline" data-action="show-history" data-id="${e(s.id)}">${state.historyOpen===s.id?'閉じる':'内容を見る'}</button></div>${state.historyOpen===s.id?`<div class="history-details"><div class="small">出題済 ${s.visited.filter(x=>!(s.skipped||[]).includes(x)).length}問 ／ スキップ ${(s.skipped||[]).length}問</div>${s.items.map((q,i)=>`<div class="small" style="padding:7px 0;border-bottom:1px solid #e3eaf3"><b>${i+1}. ${e(q.question)}</b><br><span style="color:#16764e">${e(q.answer)}</span>　${(s.skipped||[]).includes(i)?'（スキップ）':s.visited.includes(i)?'（出題済）':'（未出題）'}</div>`).join('')}</div>`:''}</div>`).join('')}<div class="note" style="margin-top:14px">過去に出題した問題をランダム抽選から除くこともできます。履歴を長期保存したい場合は、問題管理からJSONバックアップしてください。</div></div>`;}
function bindViewInputs(){if(state.route==='manage'){renderManageList();['manageSearch','manageCategory','manageDifficulty','manageActive'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener(id==='manageSearch'?'input':'change',()=>{state[id==='manageSearch'?'manageQuery':id]=el.value;state.managePage=0;renderManageList();});});}if(state.route==='setup'){if(state.mode==='random'){document.querySelector('#randomCount')?.addEventListener('change',ev=>{state.count=ev.target.value;render();});document.querySelector('#customCount')?.addEventListener('change',ev=>{state.customCount=Math.max(1,Number(ev.target.value)||1);render();});document.querySelector('#unseenOnly')?.addEventListener('change',ev=>{state.unseen=ev.target.checked;render();});}else{document.querySelector('#manualSearch')?.addEventListener('input',ev=>{state.manualQuery=ev.target.value;renderManualOnly();});document.querySelector('#manualCategory')?.addEventListener('change',ev=>{state.manualCategory=ev.target.value;renderManualOnly();});}}}
function renderManualOnly(){document.querySelector('#manualList').innerHTML=renderManualList(manualAvailable());document.querySelector('#manualCount').textContent=`候補 ${manualAvailable().length}問`;}
function updateSelectionOnly(){if(state.route==='setup'&&state.mode==='manual'){const y=document.querySelector('#selectionList');if(y)y.innerHTML=renderSelectionList();document.querySelectorAll('[data-manual]').forEach(x=>x.checked=state.manualIds.includes(x.dataset.manual));const btn=document.querySelector('[data-action="start-manual"]');if(btn){btn.disabled=state.manualIds.length===0;btn.textContent=`▶ 選択した${state.manualIds.length}問で大会を開始`;}const badge=document.querySelector('#manualSelectedCount');if(badge)badge.textContent=`選択中 ${state.manualIds.length}問`;}} 
function showEdit(id){const q=id?qById(id):null;document.querySelector('#editTitle').textContent=q?`No.${q.number} を編集`:'新しい問題を追加';document.querySelector('#edit-id').value=q?.id||'';document.querySelector('#edit-question').value=q?.question||'';document.querySelector('#edit-answer').value=q?.answer||'';document.querySelector('#edit-aliases').value=q?.aliases||'';document.querySelector('#edit-category').value=q?.category||getCats()[0]||'一般常識・雑学';document.querySelector('#edit-difficulty').value=q?.difficulty||'普通';document.querySelector('#edit-note').value=q?.note||'';document.querySelector('#edit-active').checked=q?.active!==false;document.querySelector('#categorySuggestions').innerHTML=getCats().map(c=>`<option value="${e(c)}"></option>`).join('');document.querySelector('#editDialog').showModal();}
function saveEdit(ev){ev.preventDefault();const id=document.querySelector('#edit-id').value;const question=document.querySelector('#edit-question').value.trim();const answer=document.querySelector('#edit-answer').value.trim();const category=document.querySelector('#edit-category').value.trim();if(!question||!answer||!category){toast('問題文・正解・ジャンルは必須です');return;}const duplicate=db.questions.find(q=>q.id!==id&&norm(q.question)===norm(question));if(duplicate&&!confirm(`No.${duplicate.number}と同じ問題文があります。保存しますか？`))return;const q=id?qById(id):null;const props={question,answer,category,aliases:document.querySelector('#edit-aliases').value.trim(),difficulty:document.querySelector('#edit-difficulty').value,note:document.querySelector('#edit-note').value.trim(),active:document.querySelector('#edit-active').checked,updatedAt:stamp()};if(q)Object.assign(q,props);else db.questions.push({id:uid(),number:nextNumber(),favorite:false,...props});state.cats.add(category);persist();document.querySelector('#editDialog').close();if(state.route==='manage')render();toast(q?'問題を更新しました':'問題を追加しました');}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function download(name,content,mime){const b=new Blob([content],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}
function csvCell(v){const s=String(v??'');return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCsv(){const h=['番号','問題文','正解','別解','ジャンル','難易度','補足','使用','お気に入り'];const rows=db.questions.map(q=>[q.number,q.question,q.answer,q.aliases,q.category,q.difficulty,q.note,q.active===false?'いいえ':'はい',q.favorite?'はい':'いいえ']);download('クイズ問題一覧.csv','\ufeff'+[h,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('CSVを書き出しました');}
function exportJson(){const data={type:'quiz-master-backup',exportedAt:stamp(),version:1,db};download('クイズマスター_バックアップ.json',JSON.stringify(data,null,2),'application/json;charset=utf-8');toast('JSONバックアップを保存しました');}
function parseCsv(str){const rows=[];let cur='',row=[],quote=false;str=str.replace(/^\ufeff/,'');for(let i=0;i<str.length;i++){const ch=str[i];if(quote){if(ch==='"'&&str[i+1]==='"'){cur+='"';i++;}else if(ch==='"')quote=false;else cur+=ch;}else{if(ch==='"')quote=true;else if(ch===','){row.push(cur);cur='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&str[i+1]==='\n')i++;row.push(cur);if(row.some(s=>s.trim()))rows.push(row);row=[];cur='';}else cur+=ch;}}if(quote)throw Error('CSVの引用符が閉じていません');row.push(cur);if(row.some(s=>s.trim()))rows.push(row);return rows;}
function parseCsvQuestions(src){const rows=parseCsv(src);if(rows.length<2)throw Error('見出しと問題行が必要です');const names={question:['問題文','question','問題'],answer:['正解','answer','答え'],aliases:['別解','aliases','許容する答え'],category:['ジャンル','category'],difficulty:['難易度','difficulty'],note:['補足','note','解説'],active:['使用','active']};const headers=rows[0].map(x=>x.trim().toLowerCase());const col={};for(const [k,keys] of Object.entries(names)){col[k]=headers.findIndex(h=>keys.some(x=>x.toLowerCase()===h));}if(col.question<0||col.answer<0)throw Error('問題文・正解の列がありません');const parsed=[];let invalid=0;for(const row of rows.slice(1)){const val=k=>col[k]<0?'':String(row[col[k]]??'').trim();const question=val('question'),answer=val('answer');if(!question||!answer){invalid++;continue;}const rawd=val('difficulty');parsed.push({question,answer,aliases:val('aliases'),category:val('category')||'一般常識・雑学',difficulty:['簡単','普通','難しい'].includes(rawd)?rawd:'普通',note:val('note'),active:!['いいえ','false','0','停止'].includes(val('active').toLowerCase())});}return {parsed,invalid};}
function csvPreview(file){const reader=new FileReader();reader.onload=()=>{try{const o=parseCsvQuestions(String(reader.result));importBuffer=o.parsed;const exist=new Set(db.questions.map(q=>norm(q.question)));const dupe=o.parsed.filter(q=>exist.has(norm(q.question))).length;document.querySelector('#importPreview').innerHTML=`<div class="note" style="margin-bottom:13px">読み込み：<b>${o.parsed.length}問</b> ／ 既存の同文問題：<b>${dupe}問</b> ／ 必須欄不足：<b>${o.invalid}行</b></div><div class="preview-box">${o.parsed.slice(0,8).map((q,i)=>`${i+1}. ${e(q.question)}\n正解：${e(q.answer)}`).join('\n\n')}${o.parsed.length>8?'\n…':''}</div>`;document.querySelector('#importDialog').showModal();}catch(err){toast('CSVを読み込めません：'+err.message);}};reader.onerror=()=>toast('ファイルを読み込めません');reader.readAsText(file,'UTF-8');}
function confirmCsv(){if(!importBuffer.length){toast('追加できる問題がありません');return;}const replace=document.querySelector('#csvDupMode').value==='replace';let added=0,updated=0,skipped=0;const lookup=new Map(db.questions.map(q=>[norm(q.question),q]));for(const entry of importBuffer){const key=norm(entry.question),old=lookup.get(key);if(old){if(replace){Object.assign(old,entry,{updatedAt:stamp()});updated++;}else skipped++;}else{const q={id:uid(),number:nextNumber(),favorite:false,updatedAt:stamp(),...entry};db.questions.push(q);lookup.set(key,q);added++;}}db.questions.forEach(q=>state.cats.add(q.category));persist();importBuffer=[];document.querySelector('#importDialog').close();render();toast(`新規${added}問・更新${updated}問・スキップ${skipped}問`);}
function importBackup(file){const reader=new FileReader();reader.onload=()=>{try{const o=JSON.parse(String(reader.result));const d=o.db||o;if(!d||!Array.isArray(d.questions)||!Array.isArray(d.sets)||!Array.isArray(d.history))throw Error('QUIZ MASTERのバックアップ形式ではありません');if(!d.questions.every(q=>q.id&&q.question&&q.answer&&q.category))throw Error('問題データが不正です');if(!confirm(`現在の問題${db.questions.length}問・大会履歴・セットを、バックアップの内容（${d.questions.length}問）ですべて置き換えます。よろしいですか？`))return;db=copy(d);db.version=1;state.manualIds=[];state.cats=new Set(getCats());persist();navigate('home');toast('バックアップから復元しました');}catch(err){toast('復元できません：'+err.message);}};reader.onerror=()=>toast('ファイルを読み込めません');reader.readAsText(file,'UTF-8');}
function handleAction(action,el){const id=el?.dataset?.id;const s=db.activeSession;switch(action){case 'go-random':state.mode='random';navigate('setup');break;case 'go-manual':state.mode='manual';navigate('setup');break;case 'mode-random':state.mode='random';render();break;case 'mode-manual':state.mode='manual';render();break;case 'all-cats':state.cats=new Set(getCats());render();break;case 'no-cats':state.cats.clear();render();break;case 'start-random':{const candidates=getRandomCandidates();const n=state.count==='all'?candidates.length:state.count==='custom'?Number(state.customCount):Number(state.count);if(!candidates.length||n<1){toast('出題できる問題がありません');break;}if(candidates.length<n){toast(`条件に合う問題は${candidates.length}問です。出題数を減らしてください。`);break;}newSession(shuffle(candidates).slice(0,n),'random',`ランダム大会 ${new Date().toLocaleDateString('ja-JP')}`);break;}case 'manual-add-visible':{const a=manualAvailable().map(q=>q.id);state.manualIds=[...state.manualIds,...a.filter(id=>!state.manualIds.includes(id))];updateSelectionOnly();toast(`${state.manualIds.length}問を選択しています`);break;}case 'manual-clear':state.manualIds=[];updateSelectionOnly();break;case 'remove-manual':state.manualIds=state.manualIds.filter(x=>x!==id);updateSelectionOnly();break;case 'move-up':case 'move-down':{const i=state.manualIds.indexOf(id),j=i+(action==='move-up'?-1:1);if(i>=0&&j>=0&&j<state.manualIds.length){[state.manualIds[i],state.manualIds[j]]=[state.manualIds[j],state.manualIds[i]];updateSelectionOnly();}break;}case 'shuffle-manual':state.manualIds=shuffle(state.manualIds);updateSelectionOnly();toast('順番をシャッフルしました');break;case 'start-manual':{const qs=state.manualIds.map(qById).filter(q=>q&&q.active!==false);if(!qs.length){toast('問題を選択してください');break;}newSession(qs,'manual',`選択大会 ${new Date().toLocaleDateString('ja-JP')}`);break;}case 'delete-set':{const sel=document.querySelector('#savedSet');const setId=sel?.value;const found=db.sets.find(x=>x.id===setId);if(!found){toast('削除するセットを選んでください');break;}if(confirm(`問題セット「${found.name}」を削除しますか？ 問題自体は削除されません。`)){db.sets=db.sets.filter(x=>x.id!==setId);persist();render();toast('問題セットを削除しました');}break;}case 'save-set':{if(!state.manualIds.length){toast('問題を選択してください');break;}const name=prompt('セット名を入力してください（例：中2Aクイズ大会）');if(name===null)return;if(!name.trim()){toast('セット名が空です');return;}db.sets.push({id:uid(),name:name.trim().slice(0,80),questionIds:[...state.manualIds],createdAt:stamp()});persist();render();toast('問題セットを保存しました');break;}case 'resume':navigate('play');break;case 'reveal':if(s){s.reveal=!s.reveal;s.updatedAt=stamp();persist();render();}break;case 'prev':if(s&&s.index>0){s.index--;s.reveal=false;s.updatedAt=stamp();persist();render();}break;case 'next':if(s){if(s.index===s.items.length-1){if(confirm('この大会を終了して履歴に保存しますか？')){archiveSession('完了');navigate('history');toast('大会を終了しました');}}else{s.index++;s.reveal=false;if(!s.visited.includes(s.index))s.visited.push(s.index);s.updatedAt=stamp();persist();render();}}break;case 'skip':if(s){const i=s.index;if(s.skipped.includes(i)){s.skipped=s.skipped.filter(x=>x!==i);toast('スキップを解除しました');}else{s.skipped.push(i);if(i<s.items.length-1){s.index++;if(!s.visited.includes(s.index))s.visited.push(s.index);}toast('問題をスキップしました');}s.reveal=false;s.updatedAt=stamp();persist();render();}break;case 'fav-play':if(s){const q=qById(s.items[s.index].id);if(q){q.favorite=!q.favorite;q.updatedAt=stamp();persist();render();toast(q.favorite?'お気に入りに登録しました':'お気に入りを解除しました');}}break;case 'pause':navigate('home');toast('大会を一時停止しました');break;case 'end-session':if(s&&confirm('大会を終了しますか？ 記録は履歴に保存されます。')){archiveSession('完了');navigate('history');toast('大会を終了しました');}break;case 'new-question':showEdit(null);break;case 'edit-question':showEdit(id);break;case 'toggle-active':{const q=qById(id);if(q){q.active=q.active===false;persist();render();toast(q.active?'使用を再開しました':'使用停止にしました');}break;}case 'toggle-favorite':{const q=qById(id);if(q){q.favorite=!q.favorite;persist();render();}break;}case 'page-prev':state.managePage--;renderManageList();break;case 'page-next':state.managePage++;renderManageList();break;case 'close-edit':document.querySelector('#editDialog').close();break;case 'close-import':document.querySelector('#importDialog').close();break;case 'export-csv':exportCsv();break;case 'import-csv':document.querySelector('#csvFile').click();break;case 'export-json':exportJson();break;case 'import-json':document.querySelector('#backupFile').click();break;case 'confirm-import':confirmCsv();break;case 'show-history':state.historyOpen=state.historyOpen===id?null:id;render();break;}}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.dataset.route){navigate(b.dataset.route);return;}if(b.dataset.action)handleAction(b.dataset.action,b);});
document.addEventListener('change',ev=>{const t=ev.target;if(t.matches('[data-cat]')){t.checked?state.cats.add(t.dataset.cat):state.cats.delete(t.dataset.cat);render();}else if(t.matches('[data-diff]')){t.checked?state.diffs.add(t.dataset.diff):state.diffs.delete(t.dataset.diff);render();}else if(t.matches('[data-manual]')){if(t.checked&&!state.manualIds.includes(t.dataset.manual))state.manualIds.push(t.dataset.manual);if(!t.checked)state.manualIds=state.manualIds.filter(id=>id!==t.dataset.manual);updateSelectionOnly();}else if(t.id==='savedSet'&&t.value){const s=db.sets.find(x=>x.id===t.value);if(s){state.manualIds=s.questionIds.filter(id=>{const q=qById(id);return q&&q.active!==false;});updateSelectionOnly();toast(`「${s.name}」を読み込みました`);}}});
document.querySelector('#editForm').addEventListener('submit',saveEdit);
document.querySelector('#csvFile').addEventListener('change',ev=>{if(ev.target.files?.[0])csvPreview(ev.target.files[0]);ev.target.value='';});
document.querySelector('#backupFile').addEventListener('change',ev=>{if(ev.target.files?.[0])importBackup(ev.target.files[0]);ev.target.value='';});
document.addEventListener('keydown',ev=>{if(state.route!=='play'||document.querySelector('dialog[open]')||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(ev.key==='ArrowRight'){ev.preventDefault();handleAction('next',{});}else if(ev.key==='ArrowLeft'){ev.preventDefault();handleAction('prev',{});}else if(ev.key===' '){ev.preventDefault();handleAction('reveal',{});}});
render();
</script>
</body>
</html>
